name: Frontend type-check (fork)

# FORK ONLY. The Docker build runs `vite build`, which strips types without checking them,
# so a TypeScript mistake would ship. This runs the real check (`tsc --noEmit`).
on:
  push:
    branches: [id-first-keys]

permissions:
  contents: read

jobs:
  tsc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
