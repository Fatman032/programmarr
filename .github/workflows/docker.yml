name: Build and push Docker image

on:
  push:
    branches: [master, main]   # master: build-check only. main: FORK ONLY — publishes this branch's image
  release:
    types: [published]      # the ONLY event that publishes :latest + version tags

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Login only needed when we actually push (release). Master build-check skips it.
      - name: Log in to GHCR
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fatman032/programmarr
          # :latest and the short v1.1 tag are for normal releases only; a pre-release (beta) gets :beta
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=beta,enable=${{ github.event_name == 'release' && github.event.release.prerelease == true }}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'release' || github.ref == 'refs/heads/main' }}

      # push: true ONLY on a release. On a master push this is a pure build-check —
      # it proves the image compiles but pushes nothing to GHCR, so no user ever pulls it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'release' || github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
